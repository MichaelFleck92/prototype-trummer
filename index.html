<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Georg Stefan Troller – Biopic</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="rule rule--thick"></div>
    <div class="header-inner">
      <p class="header-dates">10. Dezember 1921, Wien &mdash; 27. September 2025, Paris</p>
      <h1>Georg Stefan Troller</h1>
      <p class="header-sub">Österreichischer Jude &nbsp;&middot;&nbsp; Soldat in der US-Armee &nbsp;&middot;&nbsp; Journalist &nbsp;&middot;&nbsp; Zeuge des Jahrhunderts</p>
    </div>
    <div class="rule rule--double"></div>
  </header>

  <main>
    <section class="map-section">
      <div id="map"></div>
    </section>

    <section class="timeline-section">
      <p class="section-label">&#8212;&nbsp; Lebensstationen &nbsp;&#8212;</p>
      <div class="timeline-scroll">
        <div class="timeline-track" id="timeline"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="rule"></div>
    <p>Eine Biografie in Stationen &nbsp;&middot;&nbsp; Georg Stefan Troller (1921–2025)</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
